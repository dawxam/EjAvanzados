<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
        function divide(a, b) {
            if (b === 0) {
                throw new Error("No se puede dividir por cero");
            }
            return a / b;
        }

        try {
            console.log(divide(10, 2));
            console.log(divide(5, 0));
        } catch (error) {
            console.error(error.message);
        }
    </script>
</body>
</html>
